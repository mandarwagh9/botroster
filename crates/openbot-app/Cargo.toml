[package]
name = "openbot-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OPENBOT desktop client: a Tauri window over the desktop engine"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openbot-desktop = { path = "../openbot-desktop" }
openbot-proto = { workspace = true }
agent-client-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tauri = { version = "2", features = [] }
rfd = "0.17"

[dev-dependencies]
# `test` gives the mock runtime: the same commands, built and invoked with no
# window. Without it the shell's command layer is only reachable by clicking.
tauri = { version = "2", features = ["test"] }
tempfile = { workspace = true }
# The browser this project already ships and already tests with, for driving
# `ui/main.js` itself. A dev-dependency only — nothing in the shipped shell
# reaches the guest, and the isolation invariant runs the other way.
openbot-guest = { path = "../openbot-guest" }

[lints]
workspace = true
